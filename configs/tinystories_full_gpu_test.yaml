# Full local TinyStories GPU test.
# Uses the full data/tinystories/train.txt source, but runs a bounded test
# with a small model and a small number of checkpoints.

model:
  vocab_size: 16384
  d_model: 128
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  d_ff: 352
  max_seq_len: 256
  rope_theta: 10000.0
  norm_eps: 1e-5
  initializer_range: 0.02
  embedding_scale: null
  tie_embeddings: true
  dropout: 0.0

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 50
  max_steps: 1000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: "bf16"
  eval_every: 200
  save_every: 200
  log_every: 10
  output_dir: "./artifacts/runs"
  eval_iters: 10
  checkpoint_keep_last: 5
  always_save_checkpoint: true
  checkpoint_enabled: true

data:
  dataset: "tinystories_full"
  data_dir: "./data/tinystories"
  val_split: 0.005
  seed: 42
  source_type: "local_text"
  source_paths:
    - "./data/tinystories/train.txt"
  text_column: "text"
  cache_dir: "./artifacts/data/tinystories_full_256"
  storage_type: "memmap_bin"
  block_size: 256
  shuffle_buffer_size: 10000
  num_workers: 0

tokenizer:
  type: "byte_bpe"
  vocab_size: 16384
  reserved_special_tokens: 256
  artifact_dir: "./artifacts/tokenizer/main_16k"
  train_files:
    - "./data/tinystories/train.txt"
  min_frequency: 2
  add_prefix_space: false
  split_digits: true

device: "cuda"

# EdgeGPT Improvement 1.0: RTX 4060 8 GB training profile.
# Build the corpus and tokenizer before preparing shards; see the design doc.

model:
  vocab_size: 16384
  d_model: 384
  n_layers: 8
  n_heads: 6
  n_kv_heads: 2
  d_ff: 1024
  max_seq_len: 2048
  rope_theta: 10000.0
  norm_eps: 1e-5
  initializer_range: 0.02
  embedding_scale: null
  tie_embeddings: true
  dropout: 0.0

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 500
  max_steps: 61036
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: "bf16"
  chunked_loss: true
  gradient_checkpointing: true
  eval_every: 500
  save_every: 2500
  log_every: 10
  output_dir: "./artifacts/runs"
  eval_iters: 10
  checkpoint_keep_last: 5
  always_save_checkpoint: true
  checkpoint_enabled: true

data:
  dataset: "improvement_1_mixed_1b"
  data_dir: "./data/improvement_1"
  val_split: 0.005
  seed: 42
  source_type: "jsonl"
  source_paths:
    - "./data/improvement_1/train.jsonl"
  text_column: "text"
  cache_dir: "./artifacts/data/improvement_1_mixed_2k"
  storage_type: "memmap_bin"
  block_size: 2048
  shuffle_buffer_size: 10000
  num_workers: 0

tokenizer:
  type: "byte_bpe"
  vocab_size: 16384
  reserved_special_tokens: 256
  artifact_dir: "./artifacts/tokenizer/improvement_1_16k"
  train_files:
    - "./data/improvement_1/tokenizer_train.txt"
  min_frequency: 2
  add_prefix_space: false
  split_digits: true

device: "cuda"